name: Firmware CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build firmware and test in Renode
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Test Python host client
        run: |
          test -f tests/test_signer_client.py
          test -f tests/test_signer_transport.py
          python3 -m unittest discover -s tests -p 'test_signer_*.py' -v

      - name: Build firmware
        run: ./scripts/build-firmware.sh

      - name: Run Renode tests
        uses: antmicro/renode-test-action@v5
        with:
          renode-revision: v1.17.0
          tests-to-run: tests/signer.robot
          artifacts-path: test-results

      - name: Upload firmware and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signer-firmware-and-test-results
          path: |
            firmware/build/signer.elf
            firmware/build/signer.bin
            firmware/build/signer.map
            test-results/
          if-no-files-found: warn
          retention-days: 7
