name: Firmware CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (tag in the comment);
# Dependabot proposes updates. A tag can be moved, a SHA cannot.

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          python3 -m pip install --user -r requirements/dev.txt

      - name: cppcheck (project firmware, vendored code excluded)
        run: |
          cppcheck --enable=warning,style,performance,portability --std=c11 \
            --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem \
            -Ifirmware -Ifirmware/boot firmware/*.c firmware/boot/*.c

      - name: ruff (host client and tests)
        run: python3 -m ruff check host tests

  build-and-test:
    name: Build firmware and test in Renode
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi python3-venv

      - name: Test Ed25519 known-answer vector
        run: bash scripts/test-crypto.sh

      - name: Install Python host dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/signer-host-venv"
          HOST_PYTHON="$RUNNER_TEMP/signer-host-venv/bin/python"
          "$HOST_PYTHON" -m pip install --only-binary=:all: -r requirements/host.txt
          "$HOST_PYTHON" -m pip check
          printf 'SIGNER_HOST_PYTHON=%s\n' "$HOST_PYTHON" >> "$GITHUB_ENV"

      - name: Test Python host client
        run: |
          test -f tests/test_protocol.py
          "$SIGNER_HOST_PYTHON" -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build and sign firmware
        # A fresh development signing key per run; release signing with a
        # protected key is added together with the release workflow.
        run: ./scripts/build-firmware.sh

      - name: Report firmware size
        run: |
          {
            echo '### Firmware size'
            echo '```'
            arm-none-eabi-size firmware/build/bootloader.elf firmware/build/signer.elf
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Cortex-M4 crypto test
        run: bash scripts/build-crypto-test.sh

      - name: Run Renode tests
        uses: antmicro/renode-test-action@3b43641d8ec3e35ed7aaa00b1e6f6b51bb4f935b # v6.0.0
        with:
          renode-revision: v1.17.0
          tests-to-run: 'tests/*.robot'
          artifacts-path: test-results

      - name: Verify the approval receipt with the enrolled device key
        run: |
          test -s firmware/build/approval-receipt.json
          test -s firmware/build/device-public-key.hex
          ./scripts/signer-lab verify firmware/build/signer.bin \
            --receipt firmware/build/approval-receipt.json \
            --target staging \
            --public-key-file firmware/build/device-public-key.hex

      - name: Upload firmware and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signer-firmware-and-test-results
          path: |
            firmware/build/bootloader.elf
            firmware/build/bootloader.bin
            firmware/build/signer.elf
            firmware/build/signer.bin
            firmware/build/signer.map
            firmware/build/signer-slot-a.bin
            firmware/build/firmware-public-key.hex
            firmware/build/approval-receipt.json
            firmware/build/device-public-key.hex
            test-results/
          if-no-files-found: warn
          retention-days: 7
